allowBuilds:
  esbuild: true
  sharp: true

overrides:
  brace-expansion: 5.0.12
  fflate: 0.7.5
  postcss-selector-parser: 7.1.6
  source-map-js: 1.2.2
  vite@*: 'catalog:'

minimumReleaseAgeExclude:
  - brace-expansion@5.0.12
  - fflate@0.7.5
  - postcss-selector-parser@7.1.6
  - source-map-js@1.2.2
  - '@shikijs/core@4.5.0'
  - '@shikijs/primitive@4.5.0'
  - '@shikijs/transformers@4.5.0'
  - '@shikijs/types@4.5.0'
  - astro@7.4.1
  - satori@0.63.0
  - '@astrojs/check@0.9.11'
  - '@typescript-eslint/parser@8.72.0'
  - '@typescript-eslint/project-service@8.72.0'
  - '@typescript-eslint/scope-manager@8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.72.0'
  - '@typescript-eslint/types@8.72.0'
  - '@typescript-eslint/typescript-estree@8.72.0'
  - '@typescript-eslint/visitor-keys@8.72.0'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
